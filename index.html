function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderText(paras){return paras.map(par=>`<p>${esc(par)}</p>`).join('')}
function btn(label,action,opt='',id){return `<button type="button" class="btn ${esc(opt)}" data-action="${esc(action)}" ${id===undefined?'':`data-id="${esc(id)}"`}>${label}</button>`}
function mastery(level){const scores=STORIES.filter(st=>st.level===level).map(st=>S.results[st.id]?.best??null).filter(v=>v!==null).sort((a,b)=>b-a);const count=level<=2?5:level<=4?6:7;return {done:scores.length>=2&&scores[0]+scores[1]>=Math.ceil(.8*count*2),best:scores.slice(0,2).reduce((a,b)=>a+b,0),target:Math.ceil(.8*count*2),completed:scores.length}}
function unlocked(level){const first={A:1,B:3,C:5}[S.band];if(level<=first||S.overrides.includes(level))return true;for(let n=first;n<level;n++)if(!mastery(n).done&&!S.overrides.includes(n+1))return false;return true}
function form(phase){return FORMS.find(f=>f.band===S.band&&f.phase===phase)}
function allTestQuestions(f){return f.passages.flatMap((p,pi)=>p.questions.map(q=>({...q,passage:p,pi})))}

function routine(){const words=[['C','Check the title'],['L','Look for details'],['U','Use story clues'],['E','Explain with evidence']];return `<div class="routine" aria-label="C.L.U.E. reading steps">${words.map(([c,t])=>`<div class="routine-tile"><b>${c}</b><span>${t}</span></div>`).join('')}</div>`}
function welcome(){return `<section class="card hero"><div class="hero-layout"><div class="hero-text"><div class="eyebrow">Open a book · Follow the clues</div><h1>Welcome to the <span style="color:#ffdb86">C.L.U.E.</span><br>Reading Adventure!</h1><p class="hero-copy">Meet <strong>Pip the Clue Crawler</strong>, your playful story detective! Explore enchanted bookshelves, read little mysteries, and collect clues by thinking carefully.</p><div class="btn-row">${btn('🚀 START YOUR ADVENTURE','guide','gold')}</div><div class="hero-features"><span>📚 18 story mysteries</span><span>🗝️ 6 reading levels</span><span>💚 Learn at your pace</span></div></div>${heroArt()}</div></section><div class="feature-strip"><div class="feature"><div class="feature-icon">📖</div><div><b>Read the story</b><span>Step into an illustrated book</span></div></div><div class="feature"><div class="feature-icon">🔎</div><div><b>Discover clues</b><span>Choose answers with evidence</span></div></div><div class="feature"><div class="feature-icon">🌟</div><div><b>Grow your skills</b><span>No timers, safe retries</span></div></div></div><section class="card"><div class="eyebrow">Your detective toolkit</div><h2>Four little steps, big reading discoveries</h2>${routine()}<p class="muted small">This is an original C.L.U.E. adventure, inspired by the playful energy of word games. Reading and understanding the story come first.</p></section>`}
function guidePick(){return `<section class="card"><div class="eyebrow">Chapter 1 · Meet the team</div><h1>Choose your reading guide</h1><p class="section-lead muted">Pip will travel with you, and your chosen guide will help you think about the stories. All three offer the same learning support.</p><div class="bento">${Object.entries(GUIDE).map(([name,g])=>`<button type="button" class="tile tile-guide ${S.guide===name?'is-selected':''}" data-action="pick-guide" data-id="${name}" aria-pressed="${S.guide===name}"><span class="guide-emoji" style="background:${g.color}" aria-hidden="true">${g.emoji}</span><h3>Guide ${name}</h3><p>${g.personality}</p><span class="tag ${S.guide===name?'good':'soft'}">${S.guide===name?'✓ My guide':'Choose this guide'}</span></button>`).join('')}</div>${guide('We are going to investigate stories together. You can always reread!')}<div class="btn-row">${btn('CONTINUE TO SETUP →','setup')}</div></section>`}
function setup(){const entries=[['A','Early explorer','🌱','Start at Level 1','Short stories and three answer choices'],['B','Growing detective','🔍','Start at Level 3','More vocabulary and evidence clues'],['C','Confident investigator','🗝️','Start at Level 5','Longer stories and thoughtful choices']];return `<section class="card"><div class="eyebrow">Chapter 2 · Your reading passport</div><h1>Choose where the adventure begins</h1><p class="section-lead muted">An adult or teacher can help select a starting point based on reading ability, not just grade level.</p><div class="form-row"><label for="learner">Anonymous learner code <span class="fineprint">(no full names)</span></label><input id="learner" maxlength="30" type="text" value="${esc(S.learner)}" autocomplete="off"></div><div class="bento">${entries.map(([b,label,emoji,sub,desc])=>`<button type="button" class="tile tile-guide ${S.band===b?'is-selected':''}" data-action="set-band" data-id="${b}" aria-pressed="${S.band===b}"><span class="guide-emoji" aria-hidden="true">${emoji}</span><span class="tag">Band ${b}</span><h3>${label}</h3><p><b>${sub}</b><br>${desc}</p></button>`).join('')}</div><div class="notice warn"><strong>For teachers and adults</strong>Starting bands are flexible classroom choices, not verified grade levels. The ten-item pretest and posttest are learning checks, not standardized assessments.</div><div class="btn-row">${btn('LEARN HOW TO PLAY →','instructions')}${btn('← GUIDES','guide','ghost')}</div></section>`}
function instructions(){const steps=['Take a short reading check before playing. It is not a race.','Explore your unlocked level and choose a story mission.','Read the story carefully. Reread any time you want.','Pick an answer, then discover what the clue reveals.','Complete two different stories and earn enough mastery points to unlock your next level.'];return `<section class="card"><div class="eyebrow">Chapter 3 · Detective training</div><h1>How to play C.L.U.E.</h1><p class="section-lead muted">Every good detective follows the evidence. Here's the secret reading routine:</p>${routine()}<div class="instruction-steps">${steps.map(s=>`<div class="instruction-step"><p>${esc(s)}</p></div>`).join('')}</div>${guide('Your best tool is your brain. Read, think, and then choose!')}<div class="btn-row">${btn(S.tests.PRE?'🗺️ OPEN LEVEL MAP':'🔎 BEGIN YOUR PRETEST',S.tests.PRE?'map':'start-pre')}</div></section>`}
function test(){const f=form(S.testMode),all=allTestQuestions(f),idx=Math.max(0,Math.min(S.testIndex,all.length-1)),q=all[idx],phase=S.testMode,checked=S.testChoices[idx]??null;return `<section class="card"><div class="eyebrow">Reading check · Band ${S.band} · ${phase}</div><h1>${phase==='PRE'?'Your first reading check':'Your final reading check'}</h1><p class="muted">Question ${idx+1} of ${all.length}. Read carefully and work at your own pace. During this check, clues and explanations stay hidden.</p>${bar(idx+1,all.length)}<div class="chapter-badge">📚 ${esc(q.passage.title)}</div><article class="storybook" style="animation:none">${renderText(q.passage.passage)}</article><section class="question-card"><h2>${idx+1}. ${esc(q.stem)}</h2>${Object.entries(q.options).map(([key,value])=>`<button type="button" class="option" data-action="test-choice" data-id="${key}" aria-pressed="${checked===key}"><span class="option-letter">${key}</span><span>${esc(value)}</span></button>`).join('')}</section><div class="btn-row">${idx>0?btn('← PREVIOUS','test-prev','ghost'):''}<button class="btn" data-action="test-next" ${checked?'':'disabled'}>${idx===all.length-1?'FINISH READING CHECK':'NEXT QUESTION →'}</button></div></section>`}
function testComplete(){const phase=S.testMode,r=S.tests[phase];return `<section class="card"><div class="eyebrow">Reading check completed</div><h1>You made it to the end!</h1>${guide('Thank you for reading with care. Every bit of practice counts!')}<div class="score-layout"><div class="score-ring" style="--score:${r.score*10}%"><div class="score-ring-inner"><strong>${r.score}/10</strong><span>CLASSROOM CHECK</span></div></div><div><h2>Nice work, detective!</h2><p>You've completed the ${phase==='PRE'?'starting':'final'} reading check for Band ${S.band}. Your teacher can review the result and help you choose your next activity.</p><p class="fineprint">This score is not a grade, reading diagnosis, or standardized measurement.</p></div></div><div class="btn-row">${btn(phase==='PRE'?'🗺️ EXPLORE THE LIBRARY':'🎉 CELEBRATE READING','test-finish')}${btn('TEACHER REPORT','teacher','secondary')}</div></section>`}
function map(){const postReady=!!S.tests.PRE&&!S.tests.POST;const completed=Array.from({length:6},(_,i)=>i+1).filter(i=>mastery(i).done).length;return `<section class="card"><div class="eyebrow">The Mystery Library</div><h1>Choose your next chapter</h1><p class="section-lead muted">Every level is a bookshelf full of mysteries. Finish two different stories and collect enough reading mastery points to open the next shelf.</p><div class="feature-strip"><div class="feature"><div class="feature-icon">🧭</div><div><b>Starting Band ${S.band}</b><span>Teacher-selected entry</span></div></div><div class="feature"><div class="feature-icon">🔓</div><div><b>${completed} of 6 mastered</b><span>Level milestones</span></div></div><div class="feature"><div class="feature-icon">📖</div><div><b>${Object.keys(S.results).length} stories tried</b><span>Practice counts</span></div></div></div>${guide('Pick an open chapter. Every story hides something to discover!')}<div class="bento">${Array.from({length:6},(_,i)=>i+1).map(level=>{const m=mastery(level),u=unlocked(level),[emoji,name,desc]=LEVEL_META[level-1],points=Math.min(100,100*m.best/m.target);return `<div class="tile level-card ${m.done?'done':u?'enabled':'locked'}"><div class="level-top"><span class="level-icon" aria-hidden="true">${u?emoji:'🔒'}</span><span class="tag ${m.done?'good':u?'soft':'locked'}">${m.done?'✓ Mastered':u?'🔓 Open':'Locked'}</span></div><div class="eyebrow" style="font-size:.7rem">Book shelf ${level}</div><h2>Level ${level}</h2><h3>${name}</h3><p>${desc}<br>${m.completed} different stories tried</p><div class="meter" aria-label="${m.best} of ${m.target} mastery points"><span style="--meter:${points}%"></span></div><button type="button" class="btn ${u?'':'ghost'}" data-action="level" data-id="${level}" ${u?'':'disabled'}>${u?'OPEN MYSTERIES →':'KEEP EXPLORING 🔒'}</button></div>`}).join('')}</div><div class="btn-row">${postReady?btn('TEACHER: START POSTTEST','start-post','secondary'):''}${btn('TEACHER REPORT','teacher','ghost')}</div><p class="fineprint">Teachers can adjust level placement in the report. A posttest should be administered when the teacher determines the learner is ready, with comparable support to the pretest.</p></section>`}
function storySelect(){const level=S.currentLevel,items=STORIES.filter(st=>st.level===level),m=mastery(level);return `<section class="card"><div class="eyebrow">Level ${level} · Mystery shelf</div><h1>Choose a story mystery</h1><p class="section-lead muted">Open a storybook, investigate the details, and solve its reading questions.</p><div class="notice"><strong>🗝️ Your mission</strong>${m.completed} different stories attempted. Best two scores: ${m.best}/${m.target} mastery points. You can retry and reread without penalty.</div><div class="bento">${items.map(st=>{const res=S.results[st.id],[emoji,color]=COVER_ART[st.id];return `<div class="tile story-card ${res?'done':'enabled'}"><div class="cover" style="--cover-bg:${color}"><span class="cover-emoji" aria-hidden="true">${emoji}</span></div><div class="story-card-body"><span class="tag ${res?'good':'soft'}">${res?'✓ Practiced':'✧ New mystery'} · Story ${st.number}</span><h3>${esc(st.title)}</h3><p>${st.questions.length} clue questions<br>${res?`Best: ${res.best}/${st.questions.length} · ${res.attempts} attempt(s)`:'Not yet explored'}</p><button type="button" class="btn" data-action="open-story" data-id="${st.id}">${res?'READ AGAIN →':'OPEN STORYBOOK →'}</button></div></div>`}).join('')}</div><div class="btn-row">${btn('← MYSTERY LIBRARY','map','ghost')}</div></section>`}
function reader(){const st=STORIES.find(x=>x.id===S.selectedStory);const [emoji]=COVER_ART[st.id];return `<section class="card"><div class="eyebrow">Level ${st.level} · Mystery ${st.number}</div><div class="book-top"><div><div class="chapter-badge">${emoji} Storybook investigation</div><h1 class="story-title">${esc(st.title)}</h1><p class="muted">Read the entire story. You may return and reread it whenever you need.</p></div>${pip('side')}</div><div class="storybook" role="article" aria-label="Story: ${esc(st.title)}">${renderText(st.passage)}</div>${guide('Look for the characters, the important events, and the clues they leave behind.')}<div class="btn-row">${btn('🔎 INVESTIGATE THE QUESTIONS','start-quiz')}${btn('← CHOOSE ANOTHER STORY','stories','ghost')}</div></section>`}
function clueTrail(st,idx){return `<div class="clue-trail" aria-label="Question clue trail"><span class="trail-label">CLUE TRAIL</span>${st.questions.map((q,i)=>`<span class="clue-dot ${i<idx?'visited':i===idx?'current':''}" title="Question ${i+1}${i<idx?' answered':''}">${i<idx?'✦':i===idx?'🔎':'·'}</span>`).join('')}</div>`}
function quiz(){const st=STORIES.find(x=>x.id===S.selectedStory),idx=S.quizIndex,q=st.questions[idx],done=S.feedbackShown,chosen=S.quizAnswers[idx]||S.choice,correct=chosen===q.answer;return `<section class="card"><div class="eyebrow">Level ${st.level} · ${esc(st.title)}</div><div class="quiz-top"><div><h1>Find the right clue!</h1><p class="muted">Question ${idx+1} of ${st.questions.length} · Think like a story detective</p></div>${pip('side')}</div>${clueTrail(st,idx)}${bar(idx+1,st.questions.length)}<details><summary>📖 Open the storybook to reread</summary><div class="story">${renderText(st.passage)}</div></details><section class="question-card"><span class="tag soft">🔎 CLUE QUESTION ${idx+1}</span><h2>${esc(q.stem)}</h2>${Object.entries(q.options).map(([key,value])=>`<button type="button" class="option ${done?(key===q.answer?'correct':key===chosen?'incorrect':''):''}" data-action="quiz-choice" data-id="${key}" aria-pressed="${chosen===key}" ${done?'disabled':''}><span class="option-letter">${key}</span><span>${esc(value)}</span>${done&&key===q.answer?'<span class="option-check" aria-hidden="true">✓</span>':''}</button>`).join('')}</section>${done?`<div class="feedback ${correct?'':'warn'}" role="status"><h3>${correct?'🌟 Clue discovered!':'🧭 You found a learning opportunity!'}</h3><p class="answer-line">Correct answer: ${q.answer}. ${esc(q.answer_text)}</p><p>${esc(q.feedback_hint)}</p></div>`:guide('Read each choice and find the one the story supports.')}<div class="btn-row">${done?btn(idx+1===st.questions.length?'🏆 VIEW MY RESULTS':'NEXT CLUE →','quiz-next'):`<button type="button" class="btn" data-action="quiz-check" ${S.choice?'':'disabled'}>CHECK MY CLUE ✓</button>`}${btn('← STORY SHELF','stories','ghost')}</div></section>`}
function storyResult(){const st=STORIES.find(x=>x.id===S.selectedStory),r=S.results[st.id],last=r.history[r.history.length-1],m=mastery(st.level),miss=Object.entries(last.missed).sort((a,b)=>b[1]-a[1]),pct=100*last.score/st.questions.length;const strategies={literal:'Find the exact sentence with the detail.',inference:'Combine two clues to make an inference.','sequence-cause':'Connect what happened and why.',vocabulary:'Read around a tricky word for its meaning.',evidence:'Find the detail that proves an answer.','main-idea':'Consider what the entire story teaches.',evaluation:'Weigh options using reasons from the story.'};return `<section class="card"><div class="eyebrow">Mission completed · Level ${st.level}</div><h1>You solved the story mystery!</h1><div class="score-layout"><div class="score-ring" style="--score:${pct}%"><div class="score-ring-inner"><strong>${last.score}/${st.questions.length}</strong><span>CLUES FOUND</span></div></div><div><h2>${pct===100?'Brilliant investigating!':'Every clue makes you stronger!'}</h2><p>Your first attempt: <b>${r.first}/${st.questions.length}</b>. Best practice: <b>${r.best}/${st.questions.length}</b>. Number of tries: <b>${r.attempts}</b>.</p><div class="result-badges"><span class="tag good">📚 Story finished</span><span class="tag">🔎 ${last.score} correct clues</span><span class="tag soft">🌱 Practice counts</span></div></div></div>${guide(m.done?'Your evidence notebook says you can visit a new level!':'Wonderful effort. Another story and another try can help you grow.')}<div class="notice"><strong>🗝️ Level ${st.level} progress</strong>${m.completed} different stories attempted. Best two scores: ${m.best} / ${m.target} points needed.${m.done?' Level mastered — another shelf is ready!':''}</div>${miss.length?`<h3>Tips for your next story mission</h3><ul>${miss.slice(0,2).map(([skill])=>`<li>${esc(strategies[skill]||'Take your time and reread.')}</li>`).join('')}</ul>`:'<p class="tag good">✓ You found every clue correctly this time!</p>'}<div class="btn-row">${btn('↻ READ THIS STORY AGAIN','reader','secondary')}${btn('📚 CHOOSE ANOTHER STORY','stories')}${btn('🗺️ GO TO LIBRARY','map','ghost')}</div></section>`}
function celebrate(){const completed=Array.from({length:6},(_,i)=>i+1).filter(i=>mastery(i).done).length,pre=S.tests.PRE,post=S.tests.POST;return `<section class="card hero celebrate-panel"><div class="rays" aria-hidden="true"></div><div class="hero-layout"><div><div class="eyebrow">The adventure continues!</div><h1>Hooray, reading detective! 🎉</h1><p class="hero-copy">You followed the story clues, practiced thoughtful reading, and kept trying. There are always more stories waiting to be explored.</p><div class="btn-row">${btn('📖 KEEP READING','map','gold')}</div></div>${heroArt()}</div></section><section class="card"><div class="eyebrow">My reading notebook</div><h2>Look how far you've come</h2><div class="feature-strip"><div class="feature"><div class="feature-icon">🏆</div><div><b>${completed} levels mastered</b><span>At your own pace</span></div></div><div class="feature"><div class="feature-icon">📚</div><div><b>${Object.keys(S.results).length} stories explored</b><span>Always more to learn</span></div></div><div class="feature"><div class="feature-icon">✨</div><div><b>Reading courage</b><span>Questions are practice, not a race</span></div></div></div>${pre&&post?`<p>Reading checks: PRE ${pre.score}/10 · POST ${post.score}/10 · Difference ${post.score-pre.score>=0?'+':''}${post.score-pre.score}. This classroom signal alone does not prove causation.</p>`:''}${guide('Check the title, look for details, use clues, explain with evidence!')}</section>`}
function teacher(){const rows=STORIES.filter(st=>S.results[st.id]).map(st=>{const x=S.results[st.id];return `<tr><td>${esc(st.title)}</td><td>${st.level}</td><td>${x.first}/${st.questions.length}</td><td>${x.best}/${st.questions.length}</td><td>${x.attempts}</td></tr>`}).join('')||'<tr><td colspan="5">No story attempts recorded yet.</td></tr>';return `<section class="card"><div class="eyebrow">Teacher’s investigation notebook</div><h1>Learning progress & controls</h1><div class="notice warn"><strong>Local classroom prototype</strong>No user accounts, security login, or cloud storage are included. Use anonymous learner codes. This screen is not protected on shared devices.</div><p><b>Reader code:</b> ${esc(S.learner)} · <b>Band:</b> ${S.band} · <b>Selected guide:</b> ${esc(S.guide)}</p><p><b>Pretest:</b> ${S.tests.PRE?`${S.tests.PRE.score}/10`:'Not taken'} · <b>Posttest:</b> ${S.tests.POST?`${S.tests.POST.score}/10`:'Not taken'}</p><h2>Story practice</h2><div class="teacher"><table><thead><tr><th>Story</th><th>Level</th><th>First score</th><th>Best score</th><th>Attempts</th></tr></thead><tbody>${rows}</tbody></table></div><h2 style="margin-top:28px">Teacher placement overrides</h2><p class="muted small">Select a level to permit entry when a learner needs a different starting point. Use professional judgment and learner accommodations.</p><div class="btn-row">${Array.from({length:6},(_,i)=>i+1).map(l=>`<button type="button" class="btn ${S.overrides.includes(l)?'secondary':'ghost'}" data-action="override" data-id="${l}">${S.overrides.includes(l)?'✓ ':''}LEVEL ${l}</button>`).join('')}</div><h2 style="margin-top:28px">Export and privacy</h2><div class="btn-row">${btn('⬇️ EXPORT PROGRESS JSON','export','secondary')}${btn('🗑️ DELETE LOCAL DATA','clear','ghost')}${btn('← LEVEL MAP','map')}</div></section>`}
const SCREENS={welcome,guide:guidePick,setup,instructions,test,'test-complete':testComplete,map,stories:storySelect,reader,quiz,'story-result':storyResult,celebrate,teacher};
function applyMotion(){document.body.classList.toggle('motion-off',!motionOn);const t=$('motionToggle');if(t){t.setAttribute('aria-pressed',String(!motionOn));t.setAttribute('aria-label',motionOn?'Turn animations off':'Turn animations on');t.innerHTML=`<span aria-hidden="true">${motionOn?'✨':'⏸️'}</span><span class="btn-label">Motion ${motionOn?'on':'off'}</span>`}}
function render(keepScroll=false){const y=window.scrollY;let page=SCREENS[S.view];if(!page){S.view='welcome';page=welcome}try{$('root').innerHTML=`<div class="page-enter">${page()}</div>`}catch(e){console.error('Unable to show screen:',e);S.view='welcome';$('root').innerHTML=`<div class="page-enter">${welcome()}</div>`}$('status').textContent=`${esc(S.learner)} · BAND ${S.band} · ${Object.keys(S.results).length} STORIES`;applyMotion();save();if(keepScroll)window.scrollTo(0,y)}
function go(view){S.view=view;render();window.scrollTo({top:0,behavior:'instant'})}
function celebrateConfetti(n=28){if(!motionOn)return;const colors=['#ffd36c','#73d8c1','#ff9f81','#a6a5e9','#fff6bd'];for(let i=0;i<n;i++){const piece=document.createElement('span');piece.className='confetti-piece';piece.style.setProperty('--x',(5+Math.random()*90)+'%');piece.style.setProperty('--color',colors[i%colors.length]);piece.style.setProperty('--delay',(Math.random()*.6)+'s');piece.style.setProperty('--duration',(1.7+Math.random()*1.4)+'s');piece.style.setProperty('--sway',(-100+Math.random()*200)+'px');piece.style.width=(7+Math.random()*10)+'px';piece.style.height=(10+Math.random()*12)+'px';document.body.appendChild(piece);setTimeout(()=>piece.remove(),3800)}}
function finalizeStory(){const st=STORIES.find(x=>x.id===S.selectedStory),score=S.quizAnswers.reduce((n,a,i)=>n+(a===st.questions[i].answer?1:0),0),missed={};S.quizAnswers.forEach((a,i)=>{const q=st.questions[i];if(a!==q.answer)missed[q.skill]=(missed[q.skill]||0)+1});const prev=S.results[st.id];S.results[st.id]={first:prev?.first??score,best:Math.max(prev?.best??0,score),attempts:(prev?.attempts??0)+1,history:[...(prev?.history??[]),{score,missed,answers:[...S.quizAnswers],date:new Date().toISOString()}]};S.feedbackShown=false;S.choice=null;go('story-result');celebrateConfetti(score===st.questions.length?40:20)}
function finishTest(){const phase=S.testMode,f=form(phase),questions=allTestQuestions(f),score=S.testChoices.reduce((n,a,i)=>n+(a===questions[i].answer?1:0),0);S.tests[phase]={score,band:S.band,answers:[...S.testChoices],date:new Date().toISOString()};go('test-complete')}
function handle(action,id){switch(action){
case 'home':if(!S.tests.PRE)go('welcome');else go('map');break;
case 'motion':motionOn=!motionOn;try{localStorage.setItem('clue-motion-enabled',String(motionOn))}catch(e){}applyMotion();break;
case 'map-nav':go(S.tests.PRE?'map':'welcome');break;
case 'pip-tip':tipIndex=(tipIndex+1)%TIPS.length;const bubble=$('pip-tip-text');if(bubble)bubble.textContent=TIPS[tipIndex];break;
case 'guide':go('guide');break;
case 'pick-guide':S.guide=id;render(true);break;
case 'setup':go('setup');break;
case 'set-band':if(!S.tests.PRE){S.band=id;render(true)}else alert('This reading-check band is fixed after the pretest. Ask your teacher before restarting.');break;
case 'instructions':go('instructions');break;
case 'start-pre':if(!S.tests.PRE){S.testMode='PRE';S.testIndex=0;S.testChoices=[];go('test')}else go('map');break;
case 'start-post':if(!S.tests.PRE){alert('Complete the pretest first.');break}if(!S.tests.POST){if(!confirm('Teacher confirmation: Is this learner ready for the posttest with comparable reading supports?'))break;S.testMode='POST';S.testIndex=0;S.testChoices=[];go('test')}else go('celebrate');break;
case 'test-choice':S.testChoices[S.testIndex]=id;render(true);break;
case 'test-prev':S.testIndex=Math.max(0,S.testIndex-1);render(true);break;
case 'test-next':if(!S.testChoices[S.testIndex])break;if(S.testIndex===9)finishTest();else{S.testIndex++;render(true)}break;
case 'test-finish':go(S.testMode==='PRE'?'map':'celebrate');if(S.testMode!=='PRE')celebrateConfetti(40);break;
case 'map':go('map');break;
case 'level':{const l=Number(id);if(unlocked(l)){S.currentLevel=l;go('stories')}break}
case 'stories':go('stories');break;
case 'open-story':S.selectedStory=id;go('reader');break;
case 'reader':go('reader');break;
case 'start-quiz':S.quizIndex=0;S.choice=null;S.quizAnswers=[];S.feedbackShown=false;go('quiz');break;
case 'quiz-choice':if(!S.feedbackShown){S.choice=id;render(true)}break;
case 'quiz-check':if(!S.choice)break;S.quizAnswers[S.quizIndex]=S.choice;S.feedbackShown=true;render(true);if(S.choice===STORIES.find(st=>st.id===S.selectedStory).questions[S.quizIndex].answer)celebrateConfetti(7);break;
case 'quiz-next':{const st=STORIES.find(st=>st.id===S.selectedStory);if(S.quizIndex===st.questions.length-1){finalizeStory()}else{S.quizIndex++;S.choice=null;S.feedbackShown=false;render(true)}break}
case 'teacher':go('teacher');break;
case 'override':{const l=Number(id);S.overrides=S.overrides.includes(l)?S.overrides.filter(x=>x!==l):[...S.overrides,l];render(true);break}
case 'export':{const data={learner:S.learner,band:S.band,guide:S.guide,results:S.results,tests:S.tests,overrides:S.overrides};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CLUE_local_progress_'+S.learner.replace(/[^a-z0-9_-]/gi,'_')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);break}
case 'clear':if(confirm('Delete all saved C.L.U.E. progress on this device? This cannot be undone.')){try{localStorage.removeItem(STORE)}catch(e){}S=fresh();go('welcome')}break;
case 'celebrate':go('celebrate');break;
default:break}}
document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;if(b.tagName==='A')event.preventDefault();handle(b.dataset.action,b.dataset.id)});
document.addEventListener('change',event=>{if(event.target.id==='learner'){S.learner=event.target.value.trim().slice(0,30)||'Reader-01';save();$('status').textContent=`${S.learner} · BAND ${S.band} · ${Object.keys(S.results).length} STORIES`}});
render();
</script>
</body>
