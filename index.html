/* ===== C.L.U.E. / ARCADE EDITION: accessible, game-like visual polish ===== */
:root {
  --night:#111c37;--ink:#15223a;--muted:#4c5b72;--teal:#2759db;
  --mint:#e4f8ed;--cream:#f4f7ff;--paper:#fff;--honey:#ffd34d;
  --coral:#f04f57;--border:#cad5e8;--success:#137c48;
  --shadow:0 5px 0 rgba(27,45,83,.13),0 16px 34px rgba(26,43,82,.12);
  --round:19px;
}
body {background:linear-gradient(180deg,#e7efff 0%,#f4f7ff 42%,#f0f4ff 100%);color:var(--ink)}
body::before {z-index:0;opacity:.38;background-image:radial-gradient(circle,#98add8 1.4px,transparent 1.8px);background-size:30px 30px}

.icon-btn:hover:not(:disabled) {background:#355487;color:#fff;border-color:#9ab7ee;transform:translateY(-2px);box-shadow:0 5px 0 #080f28}
.icon-btn:active:not(:disabled) {transform:translateY(2px);box-shadow:0 1px 0 #080f28}
.icon-btn[aria-pressed=true] {background:#1a4b79;color:#fff;border-color:#81bbff}
.back-nav-btn {background:#ffd454;color:#28231b;border-color:#ffe99b;box-shadow:0 3px 0 #ad7d22}
.back-nav-btn:hover:not(:disabled) {background:#ffe381;color:#231c0e;border-color:#fff2b4;box-shadow:0 5px 0 #ad7d22}
.card {border:1.5px solid #cbd6e8;border-radius:20px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
main {max-width:1150px}

h1,h2,h3 {color:#11213d}

h2 {font-weight:875}
.muted,.fineprint {color:#465771}
.section-lead {font-weight:500}

/* Hero: electric blue, gold and bright blocks against a dark panel */
.hero {isolation:isolate;position:relative;background:linear-gradient(132deg,#121d40 1%,#163e8c 56%,#1d57bb 100%);border:2px solid #284e9b;box-shadow:0 7px 0 #a9bde4,0 21px 44px #132b6240;color:#fff;padding:clamp(28px,4vw,52px)}

.hero-art {border:2px solid #71b1ff58;background:radial-gradient(circle at 54% 45%,#3e76e0 0%,#214684 70%,#16305c 100%);box-shadow:inset 0 0 0 5px #0a1e4c24,0 12px 28px #07153665;border-radius:25px;overflow:hidden;min-height:335px}

.brick-wall {z-index:2;gap:16px;transform:rotate(-8deg)}
.brick {border:2px solid #ffffff73;border-radius:13px;width:100px;height:90px;font-size:2.65rem;text-shadow:0 2px 0 #1421393b;box-shadow:0 9px 0 #13264c64,0 18px 23px #0717356b;will-change:transform}
.brick.red {background:#f25760}.brick.blue {background:#347aff}.brick.yellow {background:#ffd64c;color:#3c351d;text-shadow:none}.brick.green {background:#22ad77}

.hero-note {z-index:3;background:#fff;border:2px solid #91bbfc;color:#193e93;font-weight:950;font-size:.71rem;border-radius:9px;padding:8px 12px;box-shadow:0 5px 0 #0c2457}

.hero-spark.s1 {top:17%;left:12%;width:22px;height:22px}
.hero-spark.s2 {top:26%;right:16%;width:15px;height:15px}
.hero-spark.s3 {bottom:25%;left:17%;width:14px;height:14px}

.meter {height:12px;background:#dfe6f5;border:1px solid #c6d1e7;border-radius:30px}

.option:hover:not(:disabled) {border-color:#326bdf;background:#ecf3ff;transform:translateX(5px);box-shadow:0 3px 0 #aebee4}
.option[aria-pressed=true] {border:2px solid #2462dc;background:#e2edff;box-shadow:0 3px 0 #9db8eb;color:#102f7c}
.option.correct {border:2px solid #148248;background:#d7f9e5;color:#0a6138}

/* Animate automatically, respecting device reduced-motion accessibility preferences. */
@media (prefers-reduced-motion:no-preference) {
 .hero-art {animation:clueHeroIn .75s cubic-bezier(.18,.85,.2,1.05) both}

 .brick:nth-child(2) {animation-delay:-.95s}
 .brick:nth-child(3) {animation-delay:-1.85s}
 .brick:nth-child(4) {animation-delay:-2.75s}
 .hero-spark {animation:clueTwinkle 2.6s ease-in-out infinite}
 .hero-spark.s2 {animation-delay:-.8s}
 .hero-spark.s3 {animation-delay:-1.8s}
 .hero-spark.s4 {animation-delay:-1s}
 .hero .btn.gold {animation:clueCTA 4.7s ease-in-out infinite}
 .page-enter {animation:cluePageIn .4s cubic-bezier(.19,.8,.3,1) both}
 .feature {animation:clueUp .5s both}
 .feature:nth-child(2) {animation-delay:.08s}
 .feature:nth-child(3) {animation-delay:.16s}
 .bento .tile {animation:clueUp .46s both}
 .bento .tile:nth-child(2) {animation-delay:.05s}
 .bento .tile:nth-child(3) {animation-delay:.1s}
 .bento .tile:nth-child(4) {animation-delay:.15s}
 .bento .tile:nth-child(5) {animation-delay:.2s}
 .bento .tile:nth-child(6) {animation-delay:.25s}
 .routine-tile {animation:clueUp .48s both}
 .routine-tile:nth-child(2) {animation-delay:.06s}
 .routine-tile:nth-child(3) {animation-delay:.12s}
 .routine-tile:nth-child(4) {animation-delay:.18s}
 .clue-dot.current {animation:clueCurrent 2.2s ease-in-out infinite}
 .feedback {animation:clueFeedback .35s cubic-bezier(.22,.8,.25,1.2) both}
 .option.correct {animation:clueCorrect .42s ease both}
 .score-ring {animation:clueScoreIn .7s cubic-bezier(.18,.85,.2,1.2) both}
 .level-card .meter>span,.progress>div {transition:width .65s cubic-bezier(.16,.85,.25,1)}
 .guide-box .mascot-mini:hover {transform:rotate(-12deg) scale(1.06)}
 .cover-emoji,.guide-box .mascot-mini {transition:transform .22s ease}
}
@keyframes cluePageIn {from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes clueUp {from{transform:translateY(14px) scale(.975);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes clueHeroIn {from{transform:translateY(17px) scale(.96);opacity:.25}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes clueBrickFloat {0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes clueTwinkle {0%,100%{opacity:.4;transform:scale(.67) rotate(0)}50%{opacity:1;transform:scale(1.22) rotate(38deg)}}
@keyframes clueCTA {0%,82%,100%{filter:brightness(1)}88%{filter:brightness(1.13)}94%{filter:brightness(1)}}
@keyframes clueCurrent {0%,100%{box-shadow:0 0 0 3px #9dbaff,0 3px 0 #8da8df}50%{box-shadow:0 0 0 6px #b8cefa,0 3px 0 #8da8df}}
@keyframes clueFeedback {from{transform:translateY(8px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes clueCorrect {0%{transform:scale(.97)}50%{transform:scale(1.018)}100%{transform:scale(1)}}
@keyframes clueScoreIn {0%{transform:scale(.78) rotate(-16deg);opacity:.2}65%{transform:scale(1.045) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@media(max-width:920px){.hero-art{min-height:280px}.brick{width:85px;height:77px}}
@media(max-width:650px){
 .nav{min-height:68px}.hero{padding:25px 18px}.hero-art{min-height:220px}.brick{width:72px;height:64px;font-size:1.9rem}.brick-wall{gap:12px}
 .hero .welcome-name .fineprint{color:#d6e6ff}.hero-note{font-size:.6rem;bottom:11px;right:10px}
 .feature {padding:14px}.card{border-radius:15px}.option {min-height:57px}
 .site-header{border-bottom-width:3px}.hero h1{font-size:clamp(2rem,8.9vw,2.85rem)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

   C.L.U.E. KIDS COSMIC ADVENTURE
   Replaces previously WHITE surfaces with colorful, readable panels.

   retains its meanings. No network assets or animation toggle.
   ================================================================== */
:root { --shadow:0 6px 0 #192e6b3a,0 20px 42px #0a0e3560; }
html {background:#11163e}
body {
  background:radial-gradient(ellipse at 10% 5%,#49318b 0,transparent 37%),

const DATA={"app":"CLUE Reading Adventure","version":"1.0-classroom-pilot","stories":[{"id":"L1S1","level":1,"number":1,"title":"The Missing Ball","passage":["One sunny morning, Ben played with his red ball. He kicked the ball near a big tree. Suddenly, the ball rolled away.","Ben looked under the tree. He looked behind the chair. He could not find his ball.","Then, he heard a small sound near the flowers. He went closer and saw his red ball.","Ben smiled and picked up his ball. He was happy to find it!"],"questions":[{"n":1,"stem":"What did Ben play with?","options":{"A":"A doll","B":"A red ball","C":"A kite"},"answer":"B","skill":"literal","answer_text":"A red ball","id":"L1S1Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"Where did Ben kick the ball?","options":{"A":"Near a big tree","B":"Inside the house","C":"Near the school"},"answer":"A","skill":"literal","answer_text":"Near a big tree","id":"L1S1Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"What happened to the ball?","options":{"A":"It broke.","B":"It rolled away.","C":"It disappeared forever."},"answer":"B","skill":"sequence-cause","answer_text":"It rolled away.","id":"L1S1Q3","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":4,"stem":"Where did Ben find his ball?","options":{"A":"Near the flowers","B":"Under the bed","C":"Inside the bag"},"answer":"A","skill":"literal","answer_text":"Near the flowers","id":"L1S1Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"How did Ben feel when he found his ball?","options":{"A":"Sad","B":"Angry","C":"Happy"},"answer":"C","skill":"inference","answer_text":"Happy","id":"L1S1Q5","feedback_hint":"Combine clues from the text to decide what makes sense."}]},{"id":"L1S2","level":1,"number":2,"title":"The Little Lost Cat","passage":["Lily saw a small white cat near her house. The cat was crying.","\"Are you lost?\" Lily asked.","She gave the cat some fresh water. The cat drank the water and purred softly.","Lily saw a name tag on the cat's neck. It said, \"Mimi.\"","She asked her mother to help find the owner. Soon, a boy came looking for his cat.","\"Thank you for finding Mimi!\" said the boy.","Lily was glad to help."],"questions":[{"n":1,"stem":"What animal did Lily see?","options":{"A":"A dog","B":"A bird","C":"A cat"},"answer":"C","skill":"literal","answer_text":"A cat","id":"L1S2Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What color was the cat?","options":{"A":"White","B":"Black","C":"Brown"},"answer":"A","skill":"literal","answer_text":"White","id":"L1S2Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"What did Lily give the cat?","options":{"A":"Bread","B":"Water","C":"Rice"},"answer":"B","skill":"literal","answer_text":"Water","id":"L1S2Q3","feedback_hint":"Find the sentence that names this detail."},{"n":4,"stem":"What was the cat's name?","options":{"A":"Mimi","B":"Kitty","C":"Bella"},"answer":"A","skill":"literal","answer_text":"Mimi","id":"L1S2Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"Who came to get the cat?","options":{"A":"A teacher","B":"A boy","C":"A farmer"},"answer":"B","skill":"literal","answer_text":"A boy","id":"L1S2Q5","feedback_hint":"Find the sentence that names this detail."}]},{"id":"L1S3","level":1,"number":3,"title":"The Mystery of the Missing Cookies","passage":["One afternoon, Ana went to the kitchen. She wanted to eat the cookies on the table.","But the cookie plate was empty!","\"Who ate my cookies?\" Ana asked.","She saw some crumbs on the floor. She followed the crumbs and found small footprints near the table.","Then, she heard a sound under the chair.","\"Meow! Meow!\"","Ana looked under the chair. She saw her little cat, Coco, with cookie crumbs on its mouth.","\"Oh, Coco! You ate the cookies!\" Ana said.","Ana laughed and gave Coco some cat food instead."],"questions":[{"n":1,"stem":"Where did Ana go?","options":{"A":"To the kitchen","B":"To the park","C":"To the classroom"},"answer":"A","skill":"literal","answer_text":"To the kitchen","id":"L1S3Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What did Ana discover about the cookie plate?","options":{"A":"It was full of cookies.","B":"It was empty.","C":"It was broken."},"answer":"B","skill":"literal","answer_text":"It was empty.","id":"L1S3Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"What did Ana see on the floor?","options":{"A":"Flowers","B":"Toys","C":"Cookie crumbs"},"answer":"C","skill":"literal","answer_text":"Cookie crumbs","id":"L1S3Q3","feedback_hint":"Find the sentence that names this detail."},{"n":4,"stem":"Where did Ana find Coco?","options":{"A":"Under the chair","B":"Behind the door","C":"Inside the cabinet"},"answer":"A","skill":"literal","answer_text":"Under the chair","id":"L1S3Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"Who ate the cookies?","options":{"A":"Ana","B":"Coco","C":"Her mother"},"answer":"B","skill":"inference","answer_text":"Coco","id":"L1S3Q5","feedback_hint":"Combine clues from the text to decide what makes sense."}]},{"id":"L2S1","level":2,"number":1,"title":"A New Friend at School","passage":["It was Monday morning. A new pupil named Daniel entered the classroom. He looked shy because he did not know anyone.","His teacher introduced him to the class. \"Everyone, this is Daniel. Please make him feel welcome,\" she said.","During recess, Daniel sat alone under a tree. Mia noticed him and invited him to play.","They played tag and shared their snacks. Daniel smiled and thanked Mia for being kind.","By the end of the day, Daniel had made a new friend. He was excited to return to school the next morning."],"questions":[{"n":1,"stem":"What day did Daniel enter his new classroom?","options":{"A":"Monday","B":"Friday","C":"Sunday"},"answer":"A","skill":"literal","answer_text":"Monday","id":"L2S1Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"How did Daniel feel when he entered the classroom?","options":{"A":"Angry","B":"Shy","C":"Sleepy"},"answer":"B","skill":"inference","answer_text":"Shy","id":"L2S1Q2","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":3,"stem":"Who invited Daniel to play?","options":{"A":"His teacher","B":"His mother","C":"Mia"},"answer":"C","skill":"literal","answer_text":"Mia","id":"L2S1Q3","feedback_hint":"Find the sentence that names this detail."},{"n":4,"stem":"What did Daniel and Mia do during recess?","options":{"A":"They played tag and shared snacks.","B":"They cleaned the classroom.","C":"They read a book."},"answer":"A","skill":"literal","answer_text":"They played tag and shared snacks.","id":"L2S1Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"What lesson can we learn from the story?","options":{"A":"We should avoid new pupils.","B":"We should be kind and welcoming.","C":"We should always play alone."},"answer":"B","skill":"main-idea","answer_text":"We should be kind and welcoming.","id":"L2S1Q5","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L2S2","level":2,"number":2,"title":"A Special Birthday","passage":["It was Emma's seventh birthday. She woke up early and saw colorful balloons hanging in the living room.","Her parents prepared a delicious chocolate cake. Her grandparents and cousins came to celebrate with her.","Emma wore her favorite pink dress. Everyone sang the birthday song while she stood beside her cake.","Before blowing out the candles, Emma made a wish. She wished for her family to stay healthy and happy.","After eating cake, Emma opened her gifts. She received a storybook, a doll, and a box of crayons.","Emma thanked everyone for making her birthday special."],"questions":[{"n":1,"stem":"How old was Emma?","options":{"A":"Six years old","B":"Seven years old","C":"Eight years old"},"answer":"B","skill":"literal","answer_text":"Seven years old","id":"L2S2Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What kind of cake did her parents prepare?","options":{"A":"Chocolate cake","B":"Strawberry cake","C":"Mango cake"},"answer":"A","skill":"literal","answer_text":"Chocolate cake","id":"L2S2Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"What color was Emma's dress?","options":{"A":"Yellow","B":"Blue","C":"Pink"},"answer":"C","skill":"literal","answer_text":"Pink","id":"L2S2Q3","feedback_hint":"Find the sentence that names this detail."},{"n":4,"stem":"What did Emma wish for?","options":{"A":"A new bicycle","B":"Her family to stay healthy and happy","C":"A big house"},"answer":"B","skill":"literal","answer_text":"Her family to stay healthy and happy","id":"L2S2Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"What did Emma do after opening her gifts?","options":{"A":"She thanked everyone.","B":"She went to sleep.","C":"She left the party."},"answer":"A","skill":"sequence-cause","answer_text":"She thanked everyone.","id":"L2S2Q5","feedback_hint":"Look for what happened first, next, or because of an event."}]},{"id":"L2S3","level":2,"number":3,"title":"The Clean-Up Day","passage":["One Friday, Teacher Rose announced that the class would have a clean-up day.","The pupils were excited to help make their school beautiful. Some children swept the classroom, while others picked up pieces of paper in the schoolyard.","Ben and Carlo worked together in the garden. They removed dry leaves and watered the plants.","After cleaning, the pupils planted colorful flowers near the school entrance. Their teacher thanked them for working together.","The school looked clean and beautiful. The children felt proud of what they had accomplished.","They learned that keeping the environment clean is everyone's responsibility."],"questions":[{"n":1,"stem":"When did the class have a clean-up day?","options":{"A":"Monday","B":"Wednesday","C":"Friday"},"answer":"C","skill":"literal","answer_text":"Friday","id":"L2S3Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What did some children do in the schoolyard?","options":{"A":"They picked up pieces of paper.","B":"They played basketball.","C":"They ate their lunch."},"answer":"A","skill":"literal","answer_text":"They picked up pieces of paper.","id":"L2S3Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"Who worked together in the garden?","options":{"A":"Ben and Carlo","B":"Emma and Mia","C":"Daniel and Leo"},"answer":"A","skill":"literal","answer_text":"Ben and Carlo","id":"L2S3Q3","feedback_hint":"Find the sentence that names this detail."},{"n":4,"stem":"What did the pupils plant near the school entrance?","options":{"A":"Trees","B":"Vegetables","C":"Colorful flowers"},"answer":"C","skill":"literal","answer_text":"Colorful flowers","id":"L2S3Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"What did the children learn?","options":{"A":"Cleaning is only the teacher's job.","B":"Everyone should help keep the environment clean.","C":"Plants do not need care."},"answer":"B","skill":"main-idea","answer_text":"Everyone should help keep the environment clean.","id":"L2S3Q5","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L3S1","level":3,"number":1,"title":"The Importance of Sharing","passage":["It was lunchtime at Greenfield Elementary School. The pupils were excited to eat their meals after a long morning of lessons.","Mark opened his lunchbox and saw his favorite chicken sandwich. Beside him was his classmate, Peter, who looked sad. When Mark asked what was wrong, Peter explained that he had forgotten to bring his lunch.","Mark looked at his sandwich and decided to share half of it with Peter. He also gave him an apple from his lunchbox.","Peter smiled and thanked Mark for his kindness. They enjoyed their lunch while talking about their favorite games.","After lunch, Peter promised to bring extra food the next day so he could share with someone else.","Mark realized that even a small act of kindness could make another person happy."],"questions":[{"n":1,"stem":"Where did the story take place?","options":{"A":"At the public market","B":"At Greenfield Elementary School","C":"At the playground"},"answer":"B","skill":"literal","answer_text":"At Greenfield Elementary School","id":"L3S1Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"Why was Peter sad during lunchtime?","options":{"A":"He lost his notebook.","B":"He had no lunch with him.","C":"He forgot his homework."},"answer":"B","skill":"sequence-cause","answer_text":"He had no lunch with him.","id":"L3S1Q2","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":3,"stem":"What did Mark share with Peter?","options":{"A":"A sandwich and an apple","B":"A book and a pencil","C":"A sandwich and a juice box"},"answer":"A","skill":"literal","answer_text":"A sandwich and an apple","id":"L3S1Q3","feedback_hint":"Find the sentence that names this detail."},{"n":4,"stem":"What can we infer about Mark based on his actions?","options":{"A":"He is selfish.","B":"He is kind and generous.","C":"He does not like sharing."},"answer":"B","skill":"inference","answer_text":"He is kind and generous.","id":"L3S1Q4","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":5,"stem":"What does the word generous mean in the story?","options":{"A":"Willing to share with others","B":"Always wanting everything","C":"Afraid to help people"},"answer":"A","skill":"vocabulary","answer_text":"Willing to share with others","id":"L3S1Q5","feedback_hint":"Use the sentence around the word to work out its meaning."},{"n":6,"stem":"What is the main lesson of the story?","options":{"A":"We should always eat alone.","B":"Sharing and kindness can make others happy.","C":"We should bring expensive food to school."},"answer":"B","skill":"main-idea","answer_text":"Sharing and kindness can make others happy.","id":"L3S1Q6","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L3S2","level":3,"number":2,"title":"The Little Gardener","passage":["Every afternoon, Carlo helped his grandmother take care of their small garden. They grew tomatoes, eggplants, and leafy vegetables behind their house.","One day, his grandmother gave him a small packet of tomato seeds. She taught him how to prepare the soil, plant the seeds, and water them properly.","Carlo followed her instructions carefully. Every morning, he checked the soil and watered the plants when needed. He also removed the weeds that grew around them.","After several weeks, tiny green tomatoes appeared. Carlo was excited because his hard work was finally showing results.","When the tomatoes became red and ripe, his grandmother harvested them. She used the fresh tomatoes to prepare a delicious meal for the family.","Carlo felt proud because he learned that patience and responsibility could bring wonderful results."],"questions":[{"n":1,"stem":"What vegetables did Carlo and his grandmother grow?","options":{"A":"Tomatoes, eggplants, and leafy vegetables","B":"Carrots, potatoes, and onions","C":"Corn, pumpkins, and beans"},"answer":"A","skill":"literal","answer_text":"Tomatoes, eggplants, and leafy vegetables","id":"L3S2Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What did Carlo's grandmother give him?","options":{"A":"A watering can","B":"A packet of tomato seeds","C":"A basket of vegetables"},"answer":"B","skill":"literal","answer_text":"A packet of tomato seeds","id":"L3S2Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"Why did Carlo remove the weeds around the plants?","options":{"A":"To help the plants grow properly","B":"To make the garden look empty","C":"To give the plants more shade"},"answer":"A","skill":"inference","answer_text":"To help the plants grow properly","id":"L3S2Q3","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":4,"stem":"What happened after several weeks?","options":{"A":"The garden dried up.","B":"The seeds disappeared.","C":"Tiny green tomatoes appeared."},"answer":"C","skill":"literal","answer_text":"Tiny green tomatoes appeared.","id":"L3S2Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"What does the word harvested mean in the story?","options":{"A":"Planted seeds in the soil","B":"Collected crops that were ready","C":"Watered the plants every morning"},"answer":"B","skill":"vocabulary","answer_text":"Collected crops that were ready","id":"L3S2Q5","feedback_hint":"Use the sentence around the word to work out its meaning."},{"n":6,"stem":"What lesson did Carlo learn from gardening?","options":{"A":"Good results come from patience and responsibility.","B":"Plants grow without care.","C":"Gardening is only for adults."},"answer":"A","skill":"main-idea","answer_text":"Good results come from patience and responsibility.","id":"L3S2Q6","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L3S3","level":3,"number":3,"title":"The School Reading Challenge","passage":["At the beginning of the school year, Teacher Maria announced a reading challenge for her Grade 3 class. Each pupil was encouraged to read one storybook every week.","Some pupils were excited, while others felt nervous because they were not used to reading regularly.","One of the pupils, named Lisa, found reading difficult. She often stopped when she encountered unfamiliar words. Instead of giving up, she asked her teacher for help.","Teacher Maria taught her how to use context clues to understand difficult words. Lisa also practiced reading aloud at home with her older sister.","After a few weeks, Lisa became more confident. She could read longer stories and explain what happened in them.","At the end of the month, Teacher Maria praised Lisa for her effort and improvement. Lisa realized that learning takes time, practice, and determination.","She promised herself that she would continue reading even after the challenge ended."],"questions":[{"n":1,"stem":"What activity did Teacher Maria announce?","options":{"A":"A drawing contest","B":"A reading challenge","C":"A singing competition"},"answer":"B","skill":"literal","answer_text":"A reading challenge","id":"L3S3Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"Why did Lisa find reading difficult?","options":{"A":"She did not have any books.","B":"She was afraid of her classmates.","C":"She struggled with unfamiliar words."},"answer":"C","skill":"sequence-cause","answer_text":"She struggled with unfamiliar words.","id":"L3S3Q2","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":3,"stem":"How did Teacher Maria help Lisa?","options":{"A":"She taught her to use context clues.","B":"She asked her to stop reading.","C":"She gave her all the answers."},"answer":"A","skill":"literal","answer_text":"She taught her to use context clues.","id":"L3S3Q3","feedback_hint":"Find the sentence that names this detail."},{"n":4,"stem":"What helped Lisa become more confident?","options":{"A":"Watching television every day","B":"Practicing reading with her sister","C":"Playing outside every afternoon"},"answer":"B","skill":"sequence-cause","answer_text":"Practicing reading with her sister","id":"L3S3Q4","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":5,"stem":"What does the word determination mean in the story?","options":{"A":"The willingness to keep trying","B":"The feeling of being sleepy","C":"The desire to stop learning"},"answer":"A","skill":"vocabulary","answer_text":"The willingness to keep trying","id":"L3S3Q5","feedback_hint":"Use the sentence around the word to work out its meaning."},{"n":6,"stem":"What is the best message of the story?","options":{"A":"Reading is only important during competitions.","B":"We should avoid difficult activities.","C":"Practice and determination help us improve."},"answer":"C","skill":"main-idea","answer_text":"Practice and determination help us improve.","id":"L3S3Q6","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L4S1","level":4,"number":1,"title":"The Helpful Boy","passage":["One afternoon, Marco was walking home from school when he saw an elderly woman struggling to carry two heavy bags. He noticed that she was walking slowly. Marco immediately asked, \"Grandmother, would you like me to help you carry your bags?\"","The old woman smiled and said, \"That would be very kind of you, young man.\"","Marco carried one of the bags and walked with her until they reached her house. The old woman thanked him and offered him some bananas. Marco politely refused the reward and said, \"I am happy to help you.\"","When Marco arrived home, he told his mother what happened. His mother smiled proudly and reminded him that even small acts of kindness could make someone's day better."],"questions":[{"n":1,"stem":"Who is the main character in the story?","options":{"A":"Pedro","B":"Marco","C":"Juan","D":"Carlo"},"answer":"B","skill":"literal","answer_text":"Marco","id":"L4S1Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What did Marco see while walking home?","options":{"A":"A young boy playing outside","B":"A man selling bananas","C":"An old woman carrying heavy bags","D":"A teacher walking home"},"answer":"C","skill":"literal","answer_text":"An old woman carrying heavy bags","id":"L4S1Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"Which detail best shows why carrying the bags was difficult for the woman?","options":{"A":"She walked slowly while carrying two heavy bags.","B":"She offered Marco some bananas.","C":"Marco told his mother about his day.","D":"She thanked Marco for being helpful."},"answer":"A","skill":"evidence","answer_text":"She walked slowly while carrying two heavy bags.","id":"L4S1Q3","feedback_hint":"Find the detail that proves the claim."},{"n":4,"stem":"What did Marco do to help the old woman?","options":{"A":"He bought her food.","B":"He gave her money.","C":"He called her family.","D":"He carried one of her bags."},"answer":"D","skill":"literal","answer_text":"He carried one of her bags.","id":"L4S1Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"Why did Marco refuse the bananas?","options":{"A":"He did not like bananas.","B":"He was already full.","C":"He did not expect a reward for helping.","D":"He wanted to go home immediately."},"answer":"C","skill":"inference","answer_text":"He did not expect a reward for helping.","id":"L4S1Q5","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":6,"stem":"What lesson can you learn from the story?","options":{"A":"Always ask for a reward.","B":"Help others without expecting anything in return.","C":"Avoid talking to older people.","D":"Never carry heavy things."},"answer":"B","skill":"main-idea","answer_text":"Help others without expecting anything in return.","id":"L4S1Q6","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L4S2","level":4,"number":2,"title":"The Lost Puppy","passage":["One afternoon, Ana was playing outside when she heard a small puppy crying near the gate. She looked around but could not see its owner.","The puppy was brown, had white spots, and wore a red collar. Ana gently picked it up and gave it some water.","She noticed a small name tag attached to its collar. It had a phone number written on it. Ana immediately asked her father to call the number.","A few minutes later, a worried man arrived. He was the puppy's owner. He explained that the puppy had escaped from their backyard.","The man was very thankful to Ana for taking care of his pet. Ana felt happy because she had helped reunite the puppy with its family."],"questions":[{"n":1,"stem":"What did Ana hear near the gate?","options":{"A":"A kitten meowing","B":"A bird singing","C":"A puppy crying","D":"A child shouting"},"answer":"C","skill":"literal","answer_text":"A puppy crying","id":"L4S2Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What color was the puppy?","options":{"A":"Black with brown spots","B":"Brown with white spots","C":"White with black spots","D":"Gray with white spots"},"answer":"B","skill":"literal","answer_text":"Brown with white spots","id":"L4S2Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"What does the word “reunite” mean when Ana helped reunite the puppy with its family?","options":{"A":"To keep someone apart","B":"To bring together again","C":"To send someone away","D":"To stop looking for someone"},"answer":"B","skill":"vocabulary","answer_text":"To bring together again","id":"L4S2Q3","feedback_hint":"Use the sentence around the word to work out its meaning."},{"n":4,"stem":"How did Ana find the puppy's owner?","options":{"A":"She read the phone number on its name tag.","B":"She posted a picture online.","C":"She asked her neighbors.","D":"She brought it to school."},"answer":"A","skill":"sequence-cause","answer_text":"She read the phone number on its name tag.","id":"L4S2Q4","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":5,"stem":"Why was the man worried?","options":{"A":"He lost his wallet.","B":"His puppy had escaped.","C":"His house was damaged.","D":"His puppy was hungry."},"answer":"B","skill":"sequence-cause","answer_text":"His puppy had escaped.","id":"L4S2Q5","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":6,"stem":"What does the story teach us?","options":{"A":"Animals should always stay outside.","B":"Puppies should not wear collars.","C":"We should be kind and responsible toward animals.","D":"We should avoid helping lost animals."},"answer":"C","skill":"main-idea","answer_text":"We should be kind and responsible toward animals.","id":"L4S2Q6","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L4S3","level":4,"number":3,"title":"The Little Garden","passage":["Grade 4 pupils decided to create a small garden behind their classroom. Their teacher, Mrs. Santos, gave them seeds of tomatoes, eggplants, and pechay.","Every morning, the pupils took turns watering the plants. Some removed the weeds while others loosened the soil.","After several weeks, the plants began to grow. Small green leaves appeared, and the tomato plants started producing flowers.","The pupils were excited when they finally harvested their vegetables. Their teacher used the vegetables for a healthy cooking activity.","The pupils learned that plants need sunlight, water, air, and proper care to grow. They also discovered that teamwork makes difficult tasks easier."],"questions":[{"n":1,"stem":"Where did the pupils create their garden?","options":{"A":"In front of the principal's office","B":"Behind their classroom","C":"Near the school gate","D":"Beside the library"},"answer":"B","skill":"literal","answer_text":"Behind their classroom","id":"L4S3Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"Who gave them the vegetable seeds?","options":{"A":"Their principal","B":"Their parents","C":"Mrs. Santos","D":"The school guard"},"answer":"C","skill":"literal","answer_text":"Mrs. Santos","id":"L4S3Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"What does “harvested” mean when the pupils harvested vegetables?","options":{"A":"Planted new seeds","B":"Removed weeds","C":"Watered small plants","D":"Collected fully grown vegetables"},"answer":"D","skill":"vocabulary","answer_text":"Collected fully grown vegetables","id":"L4S3Q3","feedback_hint":"Use the sentence around the word to work out its meaning."},{"n":4,"stem":"Which evidence shows that the pupils worked together to care for the garden?","options":{"A":"They took turns watering plants and removing weeds.","B":"Only their teacher watered the plants.","C":"They removed all the growing leaves.","D":"They stopped caring for the garden."},"answer":"A","skill":"evidence","answer_text":"They took turns watering plants and removing weeds.","id":"L4S3Q4","feedback_hint":"Find the detail that proves the claim."},{"n":5,"stem":"What did the teacher do with the harvested vegetables?","options":{"A":"She sold them at the market.","B":"She gave them to another school.","C":"She used them for a cooking activity.","D":"She threw them away."},"answer":"C","skill":"literal","answer_text":"She used them for a cooking activity.","id":"L4S3Q5","feedback_hint":"Find the sentence that names this detail."},{"n":6,"stem":"What is the best lesson from the story?","options":{"A":"Gardening is a waste of time.","B":"Teamwork and proper care help things grow.","C":"Plants can grow without sunlight.","D":"Only teachers can grow vegetables."},"answer":"B","skill":"main-idea","answer_text":"Teamwork and proper care help things grow.","id":"L4S3Q6","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L5S1","level":5,"number":1,"title":"A Day Without Electricity","passage":["It was Saturday evening when the electricity suddenly went out in the neighborhood. Carlo was watching his favorite television show when the screen went black. His younger sister, Mia, was using a tablet, while their mother was preparing dinner.","At first, Carlo felt disappointed because he could not finish watching his show. However, his father suggested that they spend the evening doing something different.","They gathered in the living room and used a battery-powered lamp. Their father told stories about his childhood, while their mother prepared snacks. Carlo and Mia played word games and shared jokes.","After an hour, the electricity returned. Surprisingly, nobody immediately turned on the television or gadgets. They continued talking and laughing.","Carlo realized that happiness did not always depend on electricity or technology. Sometimes, the best moments happened when family members spent time together."],"questions":[{"n":1,"stem":"What happened in the neighborhood on Saturday evening?","options":{"A":"It rained heavily.","B":"The electricity went out.","C":"A fire started.","D":"The water supply stopped."},"answer":"B","skill":"literal","answer_text":"The electricity went out.","id":"L5S1Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What was Carlo doing before the electricity went out?","options":{"A":"Reading a book","B":"Playing basketball","C":"Watching television","D":"Preparing dinner"},"answer":"C","skill":"literal","answer_text":"Watching television","id":"L5S1Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"How did Carlo initially feel about the power interruption?","options":{"A":"Excited","B":"Disappointed","C":"Angry at his sister","D":"Sleepy"},"answer":"B","skill":"inference","answer_text":"Disappointed","id":"L5S1Q3","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":4,"stem":"What did the family do while waiting for the electricity to return?","options":{"A":"They went to the mall.","B":"They slept immediately.","C":"They played video games.","D":"They shared stories and played word games."},"answer":"D","skill":"literal","answer_text":"They shared stories and played word games.","id":"L5S1Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"Why did Carlo's father suggest doing something different?","options":{"A":"He wanted the family to spend time together.","B":"He wanted to buy a new television.","C":"He wanted Carlo to sleep.","D":"He wanted to leave the house."},"answer":"A","skill":"inference","answer_text":"He wanted the family to spend time together.","id":"L5S1Q5","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":6,"stem":"What does the family’s choice to keep talking after the electricity returned suggest?","options":{"A":"They forgot the power had returned.","B":"They enjoyed spending time together.","C":"They no longer needed electricity at home.","D":"They were worried about their television."},"answer":"B","skill":"inference","answer_text":"They enjoyed spending time together.","id":"L5S1Q6","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":7,"stem":"What is the main message of the story?","options":{"A":"Families should avoid using electricity.","B":"Spending quality time with family is important.","C":"Children should not watch television.","D":"Gadgets should be removed from every home."},"answer":"B","skill":"main-idea","answer_text":"Spending quality time with family is important.","id":"L5S1Q7","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L5S2","level":5,"number":2,"title":"The Importance of Saving Water","passage":["During a science class, Mr. Reyes discussed the importance of water conservation. He explained that water is essential for drinking, cooking, cleaning, and growing food.","One day, the pupils noticed that a faucet near their school garden was leaking. Water continued to drip even when nobody was using it.","Instead of ignoring the problem, a group of pupils informed their teacher. Mr. Reyes contacted the school maintenance worker, who repaired the faucet the following day.","The pupils also started a water-saving campaign. They placed reminder signs near the sinks and encouraged everyone to turn off faucets after using them.","After a month, the pupils noticed that less water was being wasted. Their small actions encouraged other classes to practice water conservation.","They learned that protecting natural resources was not only the responsibility of adults. Even children could help make a difference through simple actions."],"questions":[{"n":1,"stem":"What topic did Mr. Reyes discuss during science class?","options":{"A":"Air pollution","B":"Water conservation","C":"Animal protection","D":"Climate change"},"answer":"B","skill":"literal","answer_text":"Water conservation","id":"L5S2Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"Why is water important in our daily lives?","options":{"A":"It is used only for bathing.","B":"It is used only for cleaning.","C":"It is needed for drinking, cooking, cleaning, and growing food.","D":"It is used only by farmers."},"answer":"C","skill":"literal","answer_text":"It is needed for drinking, cooking, cleaning, and growing food.","id":"L5S2Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"What problem did the pupils discover near the school garden?","options":{"A":"A broken window","B":"A clogged drainage","C":"A damaged fence","D":"A leaking faucet"},"answer":"D","skill":"literal","answer_text":"A leaking faucet","id":"L5S2Q3","feedback_hint":"Find the sentence that names this detail."},{"n":4,"stem":"How did the pupils respond to the problem?","options":{"A":"They informed their teacher.","B":"They ignored the leaking faucet.","C":"They stopped using water.","D":"They left the school garden."},"answer":"A","skill":"literal","answer_text":"They informed their teacher.","id":"L5S2Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"What was the purpose of placing reminder signs near the sinks?","options":{"A":"To decorate the school","B":"To remind everyone to save water","C":"To identify classroom assignments","D":"To announce school activities"},"answer":"B","skill":"sequence-cause","answer_text":"To remind everyone to save water","id":"L5S2Q5","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":6,"stem":"Which detail best shows that the water-saving campaign worked?","options":{"A":"The pupils made reminder signs.","B":"The faucet was near the garden.","C":"Less water was wasted after a month.","D":"The pupils studied science."},"answer":"C","skill":"evidence","answer_text":"Less water was wasted after a month.","id":"L5S2Q6","feedback_hint":"Find the detail that proves the claim."},{"n":7,"stem":"What is the main message of the story?","options":{"A":"Only adults can protect natural resources.","B":"Water conservation is not necessary.","C":"Children should avoid participating in campaigns.","D":"Everyone can help conserve water through simple actions."},"answer":"D","skill":"main-idea","answer_text":"Everyone can help conserve water through simple actions.","id":"L5S2Q7","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L5S3","level":5,"number":3,"title":"The Power of Perseverance","passage":["Joshua was a Grade 5 pupil who loved playing basketball. Although he was active in sports, he sometimes struggled with Mathematics. Whenever he encountered difficult problems, he became frustrated and wanted to stop answering.","One day, his Mathematics teacher announced an upcoming examination. Joshua felt nervous because he had received low scores in previous tests.","His teacher noticed his difficulty and advised him to practice a little every day. Joshua followed her advice. He reviewed his lessons after school, answered practice exercises, and asked questions whenever he did not understand something.","His parents also supported him by providing a quiet place to study.","On examination day, Joshua carefully read every question and remembered the strategies he had practiced. When the results were released, he received a much higher score than before.","Joshua was proud of himself. He realized that success did not happen overnight. It required patience, effort, and perseverance."],"questions":[{"n":1,"stem":"What was Joshua's favorite sport?","options":{"A":"Volleyball","B":"Basketball","C":"Football","D":"Badminton"},"answer":"B","skill":"literal","answer_text":"Basketball","id":"L5S3Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What subject did Joshua find difficult?","options":{"A":"English","B":"Science","C":"Mathematics","D":"Filipino"},"answer":"C","skill":"literal","answer_text":"Mathematics","id":"L5S3Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"Why was Joshua nervous about the examination?","options":{"A":"He had received low scores in previous tests.","B":"He forgot his school uniform.","C":"He did not bring his pencil.","D":"He wanted to play basketball."},"answer":"A","skill":"sequence-cause","answer_text":"He had received low scores in previous tests.","id":"L5S3Q3","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":4,"stem":"What advice did his teacher give him?","options":{"A":"Stop playing sports.","B":"Memorize all the answers.","C":"Avoid asking questions.","D":"Practice a little every day."},"answer":"D","skill":"literal","answer_text":"Practice a little every day.","id":"L5S3Q4","feedback_hint":"Find the sentence that names this detail."},{"n":5,"stem":"How did Joshua prepare for the examination?","options":{"A":"He played games every afternoon.","B":"He reviewed lessons and answered practice exercises.","C":"He copied his classmates' answers.","D":"He stopped studying Mathematics."},"answer":"B","skill":"literal","answer_text":"He reviewed lessons and answered practice exercises.","id":"L5S3Q5","feedback_hint":"Find the sentence that names this detail."},{"n":6,"stem":"Which detail best shows that Joshua’s practice helped him improve?","options":{"A":"He liked playing basketball.","B":"His parents gave him a quiet study space.","C":"He received a much higher examination score.","D":"He felt nervous before the examination."},"answer":"C","skill":"evidence","answer_text":"He received a much higher examination score.","id":"L5S3Q6","feedback_hint":"Find the detail that proves the claim."},{"n":7,"stem":"What does the story teach us about achieving success?","options":{"A":"Success requires patience, effort, and perseverance.","B":"Success depends only on talent.","C":"Difficult subjects should be avoided.","D":"Studying is unnecessary when you are talented."},"answer":"A","skill":"main-idea","answer_text":"Success requires patience, effort, and perseverance.","id":"L5S3Q7","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L6S1","level":6,"number":1,"title":"The Hidden Cost of Social Media","passage":["Lara was a Grade 6 pupil who enjoyed using social media. She often watched videos, followed online personalities, and shared pictures with her friends. At first, she used social media mainly for entertainment and communication.","However, as time passed, Lara began spending several hours online every day. She sometimes stayed awake late at night scrolling through videos. Because of this habit, she often felt tired in class and struggled to complete her assignments.","One afternoon, her teacher discussed responsible technology use. She explained that social media could provide useful information and opportunities for communication, but excessive use could affect a person's health, studies, and relationships.","Lara reflected on her habits and decided to make changes. She created a daily schedule, limited her screen time, and prioritized her schoolwork. She also started spending more time reading books and playing outdoors.","After a few weeks, Lara noticed that she could concentrate better in class and had more time for her family.","She learned that technology was a useful tool, but people needed discipline to use it wisely."],"questions":[{"n":1,"stem":"What did Lara enjoy doing on social media?","options":{"A":"Selling products","B":"Watching videos and sharing pictures","C":"Teaching online classes","D":"Playing musical instruments"},"answer":"B","skill":"literal","answer_text":"Watching videos and sharing pictures","id":"L6S1Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"How did excessive social media use affect Lara?","options":{"A":"She became more active in sports.","B":"She finished all her assignments early.","C":"She became tired and struggled with schoolwork.","D":"She improved her sleeping habits."},"answer":"C","skill":"sequence-cause","answer_text":"She became tired and struggled with schoolwork.","id":"L6S1Q2","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":3,"stem":"What important lesson did her teacher discuss?","options":{"A":"Responsible technology use","B":"The history of computers","C":"The importance of television","D":"The dangers of reading books"},"answer":"A","skill":"literal","answer_text":"Responsible technology use","id":"L6S1Q3","feedback_hint":"Find the sentence that names this detail."},{"n":4,"stem":"Which detail best explains why Lara decided to change her habits?","options":{"A":"She wanted to share more pictures.","B":"Her friends suggested new videos.","C":"She received a new phone.","D":"Staying online was affecting her sleep and schoolwork."},"answer":"D","skill":"evidence","answer_text":"Staying online was affecting her sleep and schoolwork.","id":"L6S1Q4","feedback_hint":"Find the detail that proves the claim."},{"n":5,"stem":"Which action shows Lara's effort to manage her screen time?","options":{"A":"Staying online until midnight","B":"Creating a daily schedule and limiting screen time","C":"Watching more videos","D":"Using two gadgets at the same time"},"answer":"B","skill":"literal","answer_text":"Creating a daily schedule and limiting screen time","id":"L6S1Q5","feedback_hint":"Find the sentence that names this detail."},{"n":6,"stem":"What happened after Lara changed her habits?","options":{"A":"She stopped attending school.","B":"She became less interested in learning.","C":"She concentrated better and had more time for family.","D":"She spent more time scrolling through videos."},"answer":"C","skill":"sequence-cause","answer_text":"She concentrated better and had more time for family.","id":"L6S1Q6","feedback_hint":"Look for what happened first, next, or because of an event."},{"n":7,"stem":"What is the best conclusion from the story?","options":{"A":"Technology is always harmful.","B":"Social media should be used by adults only.","C":"Students should never use gadgets.","D":"Technology is useful when used responsibly and with discipline."},"answer":"D","skill":"main-idea","answer_text":"Technology is useful when used responsibly and with discipline.","id":"L6S1Q7","feedback_hint":"Think about the lesson or idea that connects the whole story."}]},{"id":"L6S2","level":6,"number":2,"title":"Saving the Community Mango Tree","passage":["In a small community, there was an old mango tree that stood beside the basketball court. For many years, it provided shade for children, vendors, and elderly residents. People gathered under its branches to rest, talk, and enjoy the cool breeze.","One day, the community received news that the area would be cleared to make space for a new building. Some residents supported the plan because they believed it would provide more opportunities for the community. Others worried about losing the tree and the benefits it provided.","A group of Grade 6 pupils decided to speak with their community leaders. They prepared a short presentation explaining the importance of trees. They discussed how trees provide oxygen, absorb carbon dioxide, prevent soil erosion, and offer shelter to animals.","The pupils suggested keeping the old mango tree and adjusting the building plan to protect it.","After listening to their proposal, the community leaders agreed to consult an engineer about possible changes to the design.","The pupils realized that young people could contribute to important community decisions when they used knowledge, cooperation, and respectful communication."],"questions":[{"n":1,"stem":"Where was the old mango tree located?","options":{"A":"Beside the community basketball court","B":"Behind the school library","C":"Near the public market","D":"In front of the hospital"},"answer":"A","skill":"literal","answer_text":"Beside the community basketball court","id":"L6S2Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What benefits did the tree provide to the community?","options":{"A":"It provided electricity and water.","B":"It provided shade and a place for people to gather.","C":"It provided transportation.","D":"It served as a playground for animals only."},"answer":"B","skill":"literal","answer_text":"It provided shade and a place for people to gather.","id":"L6S2Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"Why did some residents support clearing the area?","options":{"A":"They wanted to remove all the trees.","B":"They wanted to build a basketball court.","C":"They believed a new building would provide more opportunities.","D":"They wanted to create a parking lot."},"answer":"C","skill":"inference","answer_text":"They believed a new building would provide more opportunities.","id":"L6S2Q3","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":4,"stem":"Why were other residents against removing the tree?","options":{"A":"They wanted to sell its fruits.","B":"They disliked the new building.","C":"They wanted to move to another community.","D":"They were concerned about losing the tree and its benefits."},"answer":"D","skill":"inference","answer_text":"They were concerned about losing the tree and its benefits.","id":"L6S2Q4","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":5,"stem":"What did the Grade 6 pupils do to protect the mango tree?","options":{"A":"They prepared a presentation about the importance of trees.","B":"They planted flowers around the basketball court.","C":"They stopped attending classes.","D":"They removed the tree themselves."},"answer":"A","skill":"literal","answer_text":"They prepared a presentation about the importance of trees.","id":"L6S2Q5","feedback_hint":"Find the sentence that names this detail."},{"n":6,"stem":"What did the community leaders decide?","options":{"A":"To cancel all community projects","B":"To consult an engineer about changing the building design","C":"To immediately cut down the tree","D":"To move the basketball court"},"answer":"B","skill":"literal","answer_text":"To consult an engineer about changing the building design","id":"L6S2Q6","feedback_hint":"Find the sentence that names this detail."},{"n":7,"stem":"Why was the pupils’ proposal stronger than simply demanding that the building project stop?","options":{"A":"It ignored the community’s need for a building.","B":"It avoided discussing the tree.","C":"It suggested a compromise that considered both the building and the tree.","D":"It asked the pupils to design the building without an engineer."},"answer":"C","skill":"evaluation","answer_text":"It suggested a compromise that considered both the building and the tree.","id":"L6S2Q7","feedback_hint":"Consider how the character or group solved the problem."}]},{"id":"L6S3","level":6,"number":3,"title":"A Choice That Changed Everything","passage":["It was the day before the school recognition program when Daniel found a wallet near the school library. He opened it carefully and discovered several bills, an identification card, and a small family photograph.","Daniel was surprised because the wallet contained a considerable amount of money. For a moment, he thought about keeping it. He knew that the money could help him buy a new pair of shoes he had wanted for a long time.","However, he remembered his parents' advice that honesty was more valuable than material possessions. He decided to bring the wallet to his class adviser.","The following morning, the owner, a school staff member named Mr. Garcia, came to claim his wallet. He was relieved because the money inside was intended for his daughter's school expenses.","Mr. Garcia thanked Daniel and praised him for his honesty. Daniel felt proud, not because he received praise, but because he knew he had made the right decision.","His experience taught him that doing what is right is not always easy, especially when faced with temptation. However, honesty builds trust and shows the true character of a person."],"questions":[{"n":1,"stem":"Where did Daniel find the wallet?","options":{"A":"Near the school library","B":"Inside the classroom","C":"At the basketball court","D":"Near the school gate"},"answer":"A","skill":"literal","answer_text":"Near the school library","id":"L6S3Q1","feedback_hint":"Find the sentence that names this detail."},{"n":2,"stem":"What items were inside the wallet?","options":{"A":"Books, pencils, and papers","B":"Money, an identification card, and a family photograph","C":"Clothes and school supplies","D":"A cellphone and a watch"},"answer":"B","skill":"literal","answer_text":"Money, an identification card, and a family photograph","id":"L6S3Q2","feedback_hint":"Find the sentence that names this detail."},{"n":3,"stem":"Why was Daniel tempted to keep the money?","options":{"A":"He wanted to buy food for his friends.","B":"He wanted to give it to his parents.","C":"He wanted to buy a new pair of shoes.","D":"He wanted to donate it to the school."},"answer":"C","skill":"inference","answer_text":"He wanted to buy a new pair of shoes.","id":"L6S3Q3","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":4,"stem":"What made Daniel change his mind?","options":{"A":"He was afraid of his classmates.","B":"He wanted to receive a reward.","C":"His teacher saw him holding the wallet.","D":"He remembered his parents' advice about honesty."},"answer":"D","skill":"evidence","answer_text":"He remembered his parents' advice about honesty.","id":"L6S3Q4","feedback_hint":"Find the detail that proves the claim."},{"n":5,"stem":"Who owned the wallet?","options":{"A":"Mr. Garcia, a school staff member","B":"Daniel's class adviser","C":"The school principal","D":"Daniel's father"},"answer":"A","skill":"literal","answer_text":"Mr. Garcia, a school staff member","id":"L6S3Q5","feedback_hint":"Find the sentence that names this detail."},{"n":6,"stem":"Why did Daniel feel proud?","options":{"A":"He received a large amount of money.","B":"He knew he had made the right decision.","C":"He was allowed to leave school early.","D":"He bought the shoes he wanted."},"answer":"B","skill":"inference","answer_text":"He knew he had made the right decision.","id":"L6S3Q6","feedback_hint":"Combine clues from the text to decide what makes sense."},{"n":7,"stem":"Which idea is most strongly supported by Daniel’s choice?","options":{"A":"Keeping found money is acceptable if no one sees you.","B":"Money is more important than trust.","C":"Doing the right thing may require resisting temptation.","D":"Good choices always earn a reward."},"answer":"C","skill":"main-idea","answer_text":"Doing the right thing may require resisting temptation.","id":"L6S3Q7","feedback_hint":"Think about the lesson or idea that connects the whole story."}]}],"assessments":[{"id":"A-POST","band":"A","phase":"POST","passages":[{"id":"A-POST-P1","title":"Mika’s Extra Pencil","passage":["Mika packed two sharpened pencils before leaving for school. During art class, her classmate Jon’s pencil broke. Jon looked worried because he still needed to finish his drawing.","Mika opened her pencil case and offered Jon her extra pencil. Jon finished his drawing before the lesson ended. He returned the pencil and said, “Thank you for helping me.” Mika was glad she had brought something she could share."],"questions":[{"id":"A-POST-P1Q1","n":1,"stem":"What did Mika pack?","options":{"A":"A box of crayons","B":"Two sharpened pencils","C":"A paintbrush"},"answer":"B","answer_text":"Two sharpened pencils","skill":"literal"},{"id":"A-POST-P1Q2","n":2,"stem":"When did Jon’s pencil break?","options":{"A":"During art class","B":"At bedtime","C":"During lunch at home"},"answer":"A","answer_text":"During art class","skill":"literal"},{"id":"A-POST-P1Q3","n":3,"stem":"Why did Mika lend Jon a pencil?","options":{"A":"She wanted his drawing.","B":"Her pencil was broken.","C":"Jon needed one to finish."},"answer":"C","answer_text":"Jon needed one to finish.","skill":"sequence-cause"},{"id":"A-POST-P1Q4","n":4,"stem":"How did Jon probably feel when he got a pencil?","options":{"A":"Relieved","B":"Jealous","C":"Sleepy"},"answer":"A","answer_text":"Relieved","skill":"inference"},{"id":"A-POST-P1Q5","n":5,"stem":"What is the best lesson from this story?","options":{"A":"Never lend school supplies.","B":"Sharing can help classmates.","C":"Bring only one pencil."},"answer":"B","answer_text":"Sharing can help classmates.","skill":"main-idea"}]},{"id":"A-POST-P2","title":"Ben Learns to Skip Rope","passage":["Ben wanted to learn how to skip rope. He practiced in the backyard after school, but the rope often caught his shoes. Ben became upset and wanted to quit.","His older sister showed him how to jump slowly and keep trying. Ben practiced for a short time each afternoon. After several days, he could skip the rope without stopping. He smiled and thanked his sister for her help. Ben learned that new skills take practice."],"questions":[{"id":"A-POST-P2Q1","n":1,"stem":"What did Ben want to learn?","options":{"A":"How to swim","B":"How to sing","C":"How to skip rope"},"answer":"C","answer_text":"How to skip rope","skill":"literal"},{"id":"A-POST-P2Q2","n":2,"stem":"Where did Ben practice?","options":{"A":"In the backyard","B":"In the classroom","C":"In the library"},"answer":"A","answer_text":"In the backyard","skill":"literal"},{"id":"A-POST-P2Q3","n":3,"stem":"What did Ben’s sister suggest?","options":{"A":"Stop jumping.","B":"Jump slowly and keep trying.","C":"Buy a new rope every day."},"answer":"B","answer_text":"Jump slowly and keep trying.","skill":"literal"},{"id":"A-POST-P2Q4","n":4,"stem":"What happened after several days?","options":{"A":"Ben skipped without stopping.","B":"Ben lost the rope.","C":"Ben gave up."},"answer":"A","answer_text":"Ben skipped without stopping.","skill":"inference"},{"id":"A-POST-P2Q5","n":5,"stem":"What is the main idea of the story?","options":{"A":"Practice never helps.","B":"Only adults can learn new skills.","C":"Practice and help can build skills."},"answer":"C","answer_text":"Practice and help can build skills.","skill":"main-idea"}]}]},{"id":"B-POST","band":"B","phase":"POST","passages":[{"id":"B-POST-P1","title":"The School Recycling Station","passage":["Grade 3 pupils noticed that paper and plastic bottles were often mixed with food waste in the schoolyard. Teacher Dina asked the class to think of a way to improve waste sorting.","Luis suggested setting up labeled containers for clean paper and empty bottles. The pupils made simple signs and explained the new system during the class meeting. They also reminded everyone to rinse bottles and keep the collection area tidy.","After two weeks, more recyclable materials were being placed in the correct containers. The school caretaker said that collecting the materials had become easier. The pupils decided to continue checking the station every Friday."],"questions":[{"id":"B-POST-P1Q1","n":1,"stem":"What problem did the class notice?","options":{"A":"The school had no classrooms.","B":"There were no school signs.","C":"Recyclables were mixed with food waste.","D":"The library was too crowded."},"answer":"C","answer_text":"Recyclables were mixed with food waste.","skill":"literal"},{"id":"B-POST-P1Q2","n":2,"stem":"Who suggested labeled containers?","options":{"A":"Luis","B":"Teacher Dina","C":"The caretaker","D":"The principal"},"answer":"A","answer_text":"Luis","skill":"literal"},{"id":"B-POST-P1Q3","n":3,"stem":"Why did the class label the containers?","options":{"A":"To hide the bottles","B":"To decorate the school stage","C":"To collect only food waste","D":"To help people sort materials correctly"},"answer":"D","answer_text":"To help people sort materials correctly","skill":"sequence-cause"},{"id":"B-POST-P1Q4","n":4,"stem":"Which detail best shows the station improved sorting?","options":{"A":"The signs were simple.","B":"More materials reached the correct containers.","C":"The schoolyard had classrooms.","D":"The caretaker worked on Fridays."},"answer":"B","answer_text":"More materials reached the correct containers.","skill":"evidence"},{"id":"B-POST-P1Q5","n":5,"stem":"What is the main lesson?","options":{"A":"Sorting waste is impossible.","B":"Only adults should care about waste.","C":"Clear plans and teamwork can improve a school.","D":"Bottles should always be mixed with food."},"answer":"C","answer_text":"Clear plans and teamwork can improve a school.","skill":"main-idea"}]},{"id":"B-POST-P2","title":"Owen’s Bread Order","passage":["Owen helped his mother prepare bread rolls for a family gathering. They needed twenty rolls. At first, Owen placed the baked rolls in a basket without counting. He was unsure how many they had finished.","His mother suggested using a checklist. Owen wrote numbers from one to twenty and marked a number each time a roll was placed in the basket. When the oven was empty, he checked the marks against the rolls.","The count showed that two rolls were still needed. Owen helped prepare the remaining rolls, and the order was ready on time. He learned that checking carefully could prevent small mistakes from becoming bigger problems."],"questions":[{"id":"B-POST-P2Q1","n":1,"stem":"What was the family preparing?","options":{"A":"Twenty bread rolls","B":"Ten birthday cards","C":"A school uniform","D":"A vegetable garden"},"answer":"A","answer_text":"Twenty bread rolls","skill":"literal"},{"id":"B-POST-P2Q2","n":2,"stem":"Why did Owen use a checklist?","options":{"A":"To choose a new oven","B":"To practice handwriting only","C":"To keep track of the bread rolls","D":"To decide who would eat first"},"answer":"C","answer_text":"To keep track of the bread rolls","skill":"sequence-cause"},{"id":"B-POST-P2Q3","n":3,"stem":"What did Owen discover after checking?","options":{"A":"There were too many rolls.","B":"The oven was missing.","C":"The basket was broken.","D":"Two rolls were still needed."},"answer":"D","answer_text":"Two rolls were still needed.","skill":"literal"},{"id":"B-POST-P2Q4","n":4,"stem":"Which action best shows Owen checking his work?","options":{"A":"He stopped counting.","B":"He compared the checklist with the rolls.","C":"He hid the basket.","D":"He asked a neighbor to guess."},"answer":"B","answer_text":"He compared the checklist with the rolls.","skill":"evidence"},{"id":"B-POST-P2Q5","n":5,"stem":"What does the word “remaining” mean in the story?","options":{"A":"Already counted","B":"Still needed","C":"Too expensive","D":"Ready to be thrown away"},"answer":"B","answer_text":"Still needed","skill":"vocabulary"}]}]},{"id":"C-POST","band":"C","phase":"POST","passages":[{"id":"C-POST-P1","title":"A Plan for the Riverside Path","passage":["A riverside path was popular with walkers and families, but litter sometimes collected near its benches. Some residents asked the council to close the path because they worried the problem would continue. Others argued that closing it would remove one of the neighborhood’s few safe outdoor spaces.","A group of pupils decided to investigate before recommending a solution. They counted the litter left near different benches over three afternoons and talked with the caretaker. Their records showed that the busiest picnic area had the most waste and that the nearest bin was far away.","The pupils proposed adding well-placed bins, clear signs, and a monthly volunteer clean-up. The council agreed to try the plan for six weeks. At the end of the trial, the caretaker recorded less litter near the benches. The pupils concluded that collecting information and testing a practical solution could improve a shared place without closing it."],"questions":[{"id":"C-POST-P1Q1","n":1,"stem":"What problem affected the riverside path?","options":{"A":"Litter near the benches","B":"A broken bridge","C":"A lack of trees","D":"A closed school"},"answer":"A","answer_text":"Litter near the benches","skill":"literal"},{"id":"C-POST-P1Q2","n":2,"stem":"Why did some residents suggest closing the path?","options":{"A":"They wanted another school.","B":"They wanted to build a market.","C":"They were concerned the litter problem would continue.","D":"They wanted to change the river’s direction."},"answer":"C","answer_text":"They were concerned the litter problem would continue.","skill":"sequence-cause"},{"id":"C-POST-P1Q3","n":3,"stem":"What evidence did the pupils collect?","options":{"A":"Only pictures of birds","B":"Litter counts and a conversation with the caretaker","C":"A list of playground games","D":"The prices of bicycles"},"answer":"B","answer_text":"Litter counts and a conversation with the caretaker","skill":"evidence"},{"id":"C-POST-P1Q4","n":4,"stem":"What does the result of the trial suggest?","options":{"A":"The path must close immediately.","B":"Signs never help.","C":"No one uses the path.","D":"The proposed changes helped reduce litter."},"answer":"D","answer_text":"The proposed changes helped reduce litter.","skill":"inference"},{"id":"C-POST-P1Q5","n":5,"stem":"Why was the pupils’ plan a reasonable compromise?","options":{"A":"It tried to keep the path open while addressing litter.","B":"It ignored the concerns of residents.","C":"It removed all benches.","D":"It asked pupils to stop studying."},"answer":"A","answer_text":"It tried to keep the path open while addressing litter.","skill":"evaluation"}]},{"id":"C-POST-P2","title":"The Science Fair Test","passage":["For the school science fair, Rina’s group built a simple solar oven using a box and reflective material. They hoped sunlight would warm the inside of the box. During their first test, the temperature barely increased. Several classmates wanted to start again with an entirely different idea.","Rina suggested recording what had happened before making changes. The group discovered that they had tested the oven in a shaded area and that the reflective flap was pointing away from the sun. During a second test, they moved the oven into direct sunlight, adjusted the flap, and measured the temperature at regular intervals.","This time, the inside became noticeably warmer. The pupils did not claim that their design was perfect; they wrote down what they had changed and what they still wanted to test. Their teacher praised them for using evidence to improve the project instead of guessing."],"questions":[{"id":"C-POST-P2Q1","n":1,"stem":"What did Rina’s group build?","options":{"A":"A wind-powered fan","B":"A water filter","C":"A solar oven","D":"A model bridge"},"answer":"C","answer_text":"A solar oven","skill":"literal"},{"id":"C-POST-P2Q2","n":2,"stem":"Why did the first test fail to warm the box much?","options":{"A":"The group had no notebook.","B":"The oven was shaded and the flap faced away from the sun.","C":"The box was painted blue.","D":"The science fair had ended."},"answer":"B","answer_text":"The oven was shaded and the flap faced away from the sun.","skill":"sequence-cause"},{"id":"C-POST-P2Q3","n":3,"stem":"Which action best demonstrates careful testing?","options":{"A":"Changing every part without notes","B":"Guessing the final temperature","C":"Asking everyone to vote on the result","D":"Measuring the temperature regularly after adjusting the setup"},"answer":"D","answer_text":"Measuring the temperature regularly after adjusting the setup","skill":"evidence"},{"id":"C-POST-P2Q4","n":4,"stem":"What can we infer about Rina?","options":{"A":"She preferred learning from results rather than giving up.","B":"She believed mistakes should be hidden.","C":"She wanted to avoid measuring anything.","D":"She thought sunlight was unnecessary."},"answer":"A","answer_text":"She preferred learning from results rather than giving up.","skill":"inference"},{"id":"C-POST-P2Q5","n":5,"stem":"What is the strongest conclusion supported by the story?","options":{"A":"Every first design will work well.","B":"Scientific tests never need changes.","C":"Evidence and revision can improve a design.","D":"A teacher should do all experiments alone."},"answer":"C","answer_text":"Evidence and revision can improve a design.","skill":"evaluation"}]}]}],"mastery":{"distinct_stories":2,"threshold":0.8,"no_retry_limit":true},"status":"Teacher pilot required; assessments are not standardized."};

function mastery(level){const scores=STORIES.filter(st=>st.level===level).map(st=>S.results[st.id]?.best??null).filter(v=>v!==null).sort((a,b)=>b-a);const count=level<=2?5:level<=4?6:7;return {done:scores.length>=2&&scores[0]+scores[1]>=Math.ceil(.8*count*2),best:scores.slice(0,2).reduce((a,b)=>a+b,0),target:Math.ceil(.8*count*2),completed:scores.length}}
function unlocked(level){return level===1||S.overrides.includes(level)||(level>1&&unlocked(level-1)&&mastery(level-1).done)}
function form(phase){return FORMS.find(f=>f.band===S.band&&f.phase===phase)}

function storyResult(){const st=STORIES.find(x=>x.id===S.selectedStory),r=S.results[st.id],last=r.history[r.history.length-1],m=mastery(st.level),miss=Object.entries(last.missed).sort((a,b)=>b[1]-a[1]),pct=100*last.score/st.questions.length;const strategies={literal:'Find the exact sentence with the detail.',inference:'Combine two clues to make an inference.','sequence-cause':'Connect what happened and why.',vocabulary:'Read around a tricky word for its meaning.',evidence:'Find the detail that proves an answer.','main-idea':'Consider what the entire story teaches.',evaluation:'Weigh options using reasons from the story.'};return `<section class="card"><div class="eyebrow">Mission completed · Level ${st.level}</div><h1>You solved the story mystery!</h1><div class="score-layout"><div class="score-ring" style="--score:${pct}%"><div class="score-ring-inner"><strong>${last.score}/${st.questions.length}</strong><span>CLUES FOUND</span></div></div><div><h2>${pct===100?'Brilliant investigating!':'Every clue makes you stronger!'}</h2><p>Your first attempt: <b>${r.first}/${st.questions.length}</b>. Best practice: <b>${r.best}/${st.questions.length}</b>. Number of tries: <b>${r.attempts}</b>.</p><div class="result-badges"><span class="tag good">${uiIcon('check')} Story finished</span><span class="tag">${uiIcon('search')} ${last.score} correct clues</span><span class="tag soft">${uiIcon('leaf')} Practice counts</span></div></div></div>${guide(m.done?'Your evidence notebook says you can visit a new level!':'Wonderful effort. Another story and another try can help you grow.')}<div class="notice"><strong>Level ${st.level} progress</strong>${m.completed} different stories attempted. Best two scores: ${m.best} / ${m.target} points needed.${m.done?' Level mastered — another shelf is ready!':''}</div>${miss.length?`<h3>Tips for your next story mission</h3><ul>${miss.slice(0,2).map(([skill])=>`<li>${esc(strategies[skill]||'Take your time and reread.')}</li>`).join('')}</ul>`:'<p class= function teacher(){const rows=STORIES.filter(st=>S.results[st.id]).map(st=>{const x=S.results[st.id];return `<tr><td>${esc(st.title)}</td><td>${st.level}</td><td>${x.first}/${st.questions.length}</td><td>${x.best}/${st.questions.length}</td><td>${x.attempts}</td></tr>`}).join('')||'<tr><td colspan="5">No story attempts recorded yet.</td></tr>';return `<section class="card"><div class="eyebrow">Teacher’s investigation notebook</div><h1>Learning progress & controls</h1><div class="notice warn"><strong>Local classroom prototype</strong>Learner's Name and progress are stored in this browser, not on a server. Avoid entering names on unsecured shared devices. Exported reports contain the learner's name; keep them private. This screen is not password-protected.</div><p><b>Learner's Name:</b> ${esc(S.learner)} · <b>Reading guide:</b> ${esc(S.guide)}</p><h2>Story practice</h2><div class="teacher"><table><thead><tr><th>Story</th><th>Level</th><th>First score</th><th>Best score</th><th>Attempts</th></tr></thead><tbody>${rows}</tbody></table></div><h2 style="margin-top:28px">Teacher placement overrides</h2><p class="muted small">Select a level to permit entry when a learner needs a different starting point. Use professional judgment and learner accommodations.</p><div class="btn-row">${Array.from({length:6},(_,i)=>i+1).map(l=>`<button type="button" class="btn ${S.overrides.includes(l)?'secondary':'ghost'}" data-action="override" data-id="${l}">${S.overrides.includes(l)?'✓ ':''}LEVEL ${l}</button>`).join('')}</div><h2 style="margin-top:28px">Optional final reading check</h2><p class="muted small">This is separate from the paper-based assessment. Choose the appropriate final-check form only if your classroom will use the game-based check. Form A: early readers, B: developing readers, C: advanced readers.</p><div class="btn-row">${['A','B','C'].map(b=>`<button type="button" class="btn ${S.band===b?'secondary':'ghost'}" data-action="post-band" data-id="${b}" aria-pressed="${S.band===b}">FORM ${b}</button>`).join('')}</div><p><b>Optional final-check result:</b> ${S.tests.POST?`${S.tests.POST.score}/10 (Form ${S.tests.POST.band})`:'Not taken'}</p><div class="btn-row">${S.tests.POST?btn(`${uiIcon('trophy')} VIEW RESULT`,'celebrate','secondary'):btn('START OPTIONAL FINAL CHECK','start-post','secondary')}</div><h2 style="margin-top:28px">Export and privacy</h2><div class="btn-row">${btn(`${uiIcon('download')} EXPORT REPORT`,'export','secondary')}${btn(`${uiIcon('trash')} DELETE LOCAL DATA`,'clear','ghost')}${btn(`${uiIcon('arrow-left')} LEVEL MAP`,'map')}</div></section>`}

function celebrateConfetti(n=28){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#f8c63d','#2862d0','#ee5c4c','#279c67','#bfd2f8'];for(let i=0;i<n;i++){const piece=document.createElement('span');piece.className='confetti-piece';piece.style.setProperty('--x',(5+Math.random()*90)+'%');piece.style.setProperty('--color',colors[i%colors.length]);piece.style.setProperty('--delay',(Math.random()*.6)+'s');piece.style.setProperty('--duration',(1.7+Math.random()*1.4)+'s');piece.style.setProperty('--sway',(-100+Math.random()*200)+'px');piece.style.width=(7+Math.random()*10)+'px';piece.style.height=(10+Math.random()*12)+'px';document.body.appendChild(piece);setTimeout(()=>piece.remove(),3800)}}
function finalizeStory(){const st=STORIES.find(x=>x.id===S.selectedStory),score=S.quizAnswers.reduce((n,a,i)=>n+(a===st.questions[i].answer?1:0),0),missed={};S.quizAnswers.forEach((a,i)=>{const q=st.questions[i];if(a!==q.answer)missed[q.skill]=(missed[q.skill]||0)+1});const prev=S.results[st.id];S.results[st.id]={first:prev?.first??score,best:Math.max(prev?.best??0,score),attempts:(prev?.attempts??0)+1,history:[...(prev?.history??[]),{score,missed,answers:[...S.quizAnswers],date:new Date().toISOString()}]};S.feedbackShown=false;S.choice=null;forgetCompletedPanels('quiz');go('story-result',false);celebrateConfetti(score===st.questions.length?40:20)}

function handle(action,id){switch(action){

 const input=$('learner');const name=(input?.value??S.learner).trim().replace(/\s+/g,' ').slice(0,60);

case 'override':{const l=Number(id);S.overrides=S.overrides.includes(l)?S.overrides.filter(x=>x!==l):[...S.overrides,l];render(true);break}
case 'post-band':if(S.tests.POST){alert('This final-check form has already been completed. To protect the recorded result, the selection cannot be changed.');break}S.band=id;render(true);break;
case 'start-post':if(!S.learner){go('welcome');break}if(!S.tests.POST){if(!confirm('Teacher confirmation: Start the optional final reading check for Form '+S.band+'?'))break;S.testMode='POST';S.testIndex=0;S.testChoices=[];go('test')}else go('celebrate');break;
case 'test-choice':S.testChoices[S.testIndex]=id;render(true);break;
case 'test-prev':if(S.testIndex>0){rememberPanel();S.testIndex--;render(true)}break;
case 'test-next':if(!S.testChoices[S.testIndex])break;if(S.testIndex===9)finishTest();else{rememberPanel();S.testIndex++;render(true)}break;
case 'test-finish':go('celebrate');celebrateConfetti(40);break;
case 'export':{const data={learner:S.learner,guide:S.guide,results:S.results,finalCheck:S.tests.POST??null,overrides:S.overrides};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CLUE_reading_progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1200);break}
case 'clear':if(confirm('Delete the saved learner name and all C.L.U.E. story progress on this device? This cannot be undone.')){try{localStorage.removeItem(STORE);localStorage.removeItem(LEGACY_STORE)}catch(e){}S=fresh();navStack.length=0;go('welcome',false)}break;
case 'celebrate':go('celebrate');break;
default:break}}

document.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;if(b.tagName==='A')event.preventDefault();handle(b.dataset.action,b.dataset.id)});
render();
</script>
